<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track My Order | PurelyHome</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#FBF9F5;
    font-family:Poppins,sans-serif;
    color:#4F463B;
}

.container{
    max-width:480px;
    margin:auto;
    padding:25px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-family:'Cormorant Garamond',serif;
    font-size:44px;
    color:#6A553A;
}

.logo p{
    color:#B88A3B;
    letter-spacing:3px;
    font-size:12px;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:24px;
    box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.title{
    text-align:center;
    font-size:28px;
    font-family:'Cormorant Garamond',serif;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8E8475;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:1px solid #E7DDCA;
    margin-bottom:15px;
    font-size:15px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:999px;
    background:#D4AF37;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#BE9826;
}

.result{
    display:none;
    margin-top:25px;
    border-top:1px solid #EEE5D7;
    padding-top:20px;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    margin-top:8px;
}

.pending{background:#FFF4D8;color:#9C6800;}
.paid{background:#DCFCE7;color:#18794E;}
.shipped{background:#DBEAFE;color:#1D4ED8;}

.info{
    margin-top:20px;
}

.info p{
    margin-bottom:12px;
    line-height:1.6;
}

.receipt{
    display:none;
    width:100%;
    border-radius:16px;
    margin-top:18px;
}

.track{
    display:none;
    background:#F8F3E8;
    border-radius:16px;
    padding:16px;
    margin-top:18px;
}

.track h3{
    color:#B88A3B;
    margin-bottom:8px;
}

.tracking-box{
    background:#F8F4EC;
    border:1px solid #EADCC3;
    border-radius:18px;
    padding:18px;
    margin-top:20px;
}

.tracking-title{
    color:#C89B2B;
    font-weight:600;
    margin-bottom:15px;
}

#trackingNumber{
    color:#7A5A34;
    font-weight:600;
    word-break:break-all;
}

.pending {
  background: #FFF3CD;
  color: #9A6700;
}

.payment-received {
  background: #E8F8EE;
  color: #15803D;
}

.preparing-order {
  background: #E0F2FE;
  color: #0369A1;
}

.shipped {
  background: #DCFCE7;
  color: #166534;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<h1>PurelyHome</h1>
<p>Naturally clean.
Softly scented.</p>
</div>

<div class="card">

<div class="title">Track My Order</div>

<p class="subtitle">
Enter your Order Number and Email Address.
</p>

<input
  id="orderInput"
  type="text"
  placeholder="Order Number (e.g. PH-ZDALLX)"
  autocomplete="off"
/>

<input
type="email"
id="emailInput"
placeholder="Email Address">

<button id="trackBtn">
View My Order
</button>

<div class="result" id="result">

<h2 id="orderNo"></h2>

<div id="statusBadge" class="status pending">
Pending
</div>
<div id="statusMessage" class="status-message"></div>

<div class="info">

<p><b>Name</b><br>
<span id="customerName"></span></p>

<p><b>Total</b><br>
<span id="totalPrice"></span></p>

<p><b>Address</b><br>
<span id="address"></span></p>

</div>

<div id="trackingBox" class="tracking-box" style="display:none;">

    <div class="tracking-title">📦 Tracking Information</div>

    <p><strong>Courier</strong></p>
    <p id="courierName"></p>

    <br>

    <p><strong>Tracking Number</strong></p>
    <p id="trackingNumber"></p>

</div>

<img id="receiptImage" class="receipt">

<div id="trackingBox" class="track">

<h3>Tracking Number</h3>

<p id="trackingNumber"></p>

</div>

</div>

</div>

</div>

<script type="module" src="track-order.js"></script>

</body>
</html>
